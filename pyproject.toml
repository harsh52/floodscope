[project]
name = "floodscope"
version = "0.1.0"
description = "An agentic flood-mapping analyst: plain-English question -> verified, cited flood map from Sentinel-1 SAR."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floodscope*"]

[tool.floodscope]
# Central config referenced by the code (see floodscope/config.py).
stac_endpoint = "https://planetarycomputer.microsoft.com/api/stac/v1"
s1_collection = "sentinel-1-grd"
